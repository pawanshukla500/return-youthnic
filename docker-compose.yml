name: return-app

services:
  return-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: return-app:latest
    container_name: Return-App
    restart: unless-stopped
    ports:
      # Expose port 3001 on localhost for reverse-proxy
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TZ=Asia/Kolkata
      - NODE_OPTIONS=--max-old-space-size=384
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-return.scan@youthnic.shop}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - PAYMENT_DATABASE_URL=${PAYMENT_DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.docker.compose.project=return-app"
      - "com.docker.compose.service=Return-App"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
