name: Build & Release Return App Desktop (Windows)

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "desktop/renderer/**"
      - "desktop-agent/**"
      - "server/claim*.ts"
      - "server/schema-claims.sql"
      - "server/schema-claim-automation.sql"
      - "server/tests/claims.test.ts"
      - "server/tests/claim-automation.test.ts"
      - "src/pages/Claims.tsx"
      - "src/types.ts"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "desktop/**"
      - "desktop/renderer/**"
      - "desktop-agent/**"
      - "server/claim*.ts"
      - "server/schema-claims.sql"
      - "server/schema-claim-automation.sql"
      - "server/tests/claims.test.ts"
      - "server/tests/claim-automation.test.ts"
      - "src/pages/Claims.tsx"
      - "src/types.ts"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifact"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: Build Desktop Setup (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Web Client & Server
        run: npm run build

      - name: Run Automated Tests
        run: npm test

      - name: Build Desktop Setup Installer
        run: npm run desktop:dist

      - name: Upload Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: return-app-windows-setup
          path: "dist-electron/Return.App.Setup.*.exe"
          if-no-files-found: error

  publish-release:
    name: Publish Desktop Release to GitHub
    needs: build-desktop
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Setup Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          FILES=(release-input/**/*.exe)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No setup files found in downloaded artifacts."
            exit 1
          fi
          printf 'Publishing %s\n' "${FILES[@]}"

          VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="desktop-v${VERSION}.${GITHUB_RUN_NUMBER}"
          echo "Publishing GitHub Release $TAG_NAME..."

          gh release create "$TAG_NAME" \
            "${FILES[@]}" \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "Return App Desktop $TAG_NAME" \
            --notes "Windows-only desktop installer for Return App ($TAG_NAME).

          ### Download
          * **Windows 10/11 x64**: \`Return.App.Setup.<version>.exe\` (NSIS, per-machine, Desktop + Start Menu shortcuts). No Chrome or Edge install needed — the supplier browser ships inside the app.

          ### Panel-wise continuous filing
          * **Six isolated supplier panels**: Meesho, Flipkart, Amazon, Myntra VB, Myntra EJ, Ajio — each keeps its own login cookies and queue.
          * **Round-robin worker**: one stuck panel (OTP, CAPTCHA, cooldown) never blocks the others; held panels rejoin from the dashboard.
          * **Meesho fully automated**; other panels run assisted (prepare + evidence, operator confirms submit).

          ### System Specifications & Optimizations:
          * **Low-Spec Optimized**: Runs smoothly on **4GB RAM and 2-Core CPUs** 24/7 with V8 heap constraints (\`--max-old-space-size=256\`) and Chromium background throttling.
          * **Auto-start on Windows**: start-at-login entry plus the ReturnAppClaimBot scheduled task — launches hidden into the tray.
          * **Bounded Resource Use**: native Windows process-tree teardown, streaming evidence downloads, 24-hour cache pruning, and adaptive idle polling." || \
          gh release upload "$TAG_NAME" "${FILES[@]}" --clobber

          # Keep only the newest two DESKTOP releases (current + previous, for rollback).
          # Android releases (v1.0.*) belong to the APK workflow and must never be touched here.
          echo "Pruning older desktop releases; keeping the newest two..."
          gh release list --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("desktop-v"))] | sort_by(.publishedAt) | reverse | .[2:] | .[].tagName' \
            | while read -r old_tag; do
              if [ -n "$old_tag" ]; then
                echo "Removing old desktop release $old_tag..."
                gh release delete "$old_tag" --cleanup-tag -y || true
              fi
            done
