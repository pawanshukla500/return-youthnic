name: CI - Typecheck, Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Web & API
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the database checks (register-db, access-db, iron). Its name contains "test", and it is
    # on localhost, so the connection rule in server/db.ts uses no TLS for it. Production data is never touched.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: return_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Vite Production Build
        run: npm run build

      - name: Run Test Suite (including the database checks)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/return_test
        run: npm test

      - name: Verify Docker Container Build
        run: docker build -t return-scan-app:test .

