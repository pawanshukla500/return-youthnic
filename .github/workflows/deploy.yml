name: Deploy Return APP to Production VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "android/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and Build Web & Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Frontend Bundle
        run: npm run build

      - name: Run Node Test Suite
        run: npm test

      - name: Verify Docker Container Build
        run: docker build -t return-scan-app:test .

  deploy:
    name: Deploy to Production VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Deployment Secrets
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
        run: |
          if [ -z "$HOSTINGER_SSH_KEY" ] || [ -z "$HOSTINGER_HOST" ]; then
            echo "::warning::HOSTINGER_SSH_KEY or HOSTINGER_HOST secret is not configured in repository secrets."
            echo "::warning::Skipping remote VPS push. Please configure repository secrets to enable automatic deployments."
            exit 0
          fi
          echo "DEPLOY_ENABLED=true" >> "$GITHUB_ENV"

      - name: Configure SSH Key
        if: env.DEPLOY_ENABLED == 'true'
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in {1..5}; do
            ssh-keyscan -T 10 -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break || sleep 2
          done

      - name: Package Source Code and Prepare Environment
        if: env.DEPLOY_ENABLED == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA_FILE: ${{ secrets.DATABASE_SSL_CA_FILE || '' }}
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA || '' }}
          SHOPIFY_DATABASE_URL: ${{ secrets.SHOPIFY_DATABASE_URL || '' }}
          SHOPIFY_SSL_CA: ${{ secrets.SHOPIFY_SSL_CA || '' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || '' }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN || 'https://return.youthnic.shop' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || '' }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || vars.RESEND_FROM_EMAIL || 'return.scan@youthnic.shop' }}
          BRANDFETCH_CLIENT_ID: ${{ secrets.BRANDFETCH_CLIENT_ID || '' }}
          OMSGURU_CLIENT_ID: ${{ secrets.OMSGURU_CLIENT_ID || '' }}
          OMSGURU_CLIENT_SECRET: ${{ secrets.OMSGURU_CLIENT_SECRET || '' }}
          OMSGURU_TOKEN: ${{ secrets.OMSGURU_TOKEN || secrets.OMSGURU_API_TOKEN || '' }}
          OMSGURU_API_TOKEN: ${{ secrets.OMSGURU_API_TOKEN || secrets.OMSGURU_TOKEN || '' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || '' }}
          PAYMENT_DATABASE_URL: ${{ secrets.PAYMENT_DATABASE_URL || '' }}
          PAYMENT_SSL_CA: ${{ secrets.PAYMENT_SSL_CA || '' }}
          PORT: ${{ vars.PORT || '3001' }}
          NODE_ENV: 'production'
        run: |
          cat <<EOF > /tmp/return-app.env
          NODE_ENV=${NODE_ENV}
          PORT=${PORT}
          DATABASE_URL=${DATABASE_URL}
          DATABASE_SSL_CA_FILE=certs/db-ca.pem
          SHOPIFY_DATABASE_URL=${SHOPIFY_DATABASE_URL}
          SESSION_SECRET=${SESSION_SECRET}
          CORS_ORIGIN=${CORS_ORIGIN}
          RESEND_API_KEY=${RESEND_API_KEY}
          RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
          BRANDFETCH_CLIENT_ID=${BRANDFETCH_CLIENT_ID}
          OMSGURU_CLIENT_ID=${OMSGURU_CLIENT_ID}
          OMSGURU_CLIENT_SECRET=${OMSGURU_CLIENT_SECRET}
          OMSGURU_TOKEN=${OMSGURU_TOKEN}
          OMSGURU_API_TOKEN=${OMSGURU_API_TOKEN}
          PAYMENT_DATABASE_URL=${PAYMENT_DATABASE_URL}
          EOF

          mkdir -p /tmp/certs
          if [ -n "$DATABASE_SSL_CA" ]; then
            printf '%s\n' "$DATABASE_SSL_CA" > /tmp/certs/db-ca.pem
          fi
          if [ -n "$SHOPIFY_SSL_CA" ]; then
            printf '%s\n' "$SHOPIFY_SSL_CA" > /tmp/certs/shopify-ca.pem
          fi
          if ( [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] ); then
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/certs/firebase-service-account.json
          fi
          if ( [ -n "$PAYMENT_SSL_CA" ] ); then
            printf '%s\n' "$PAYMENT_SSL_CA" > /tmp/certs/payment-ca.pem
          fi

          tar --warning=no-file-changed \
              --exclude='./.git' \
              --exclude='./node_modules' \
              --exclude='./android' \
              --exclude='./dist' \
              --exclude='./dist-apk' \
              --exclude='./.env*' \
              --exclude='./certs' \
              -czf /tmp/return-app-source.tar.gz .

      - name: Upload to VPS and Deploy Docker Container
        if: env.DEPLOY_ENABLED == 'true'
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || vars.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || vars.HOSTINGER_USER || 'root' }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT || 22 }}
          APP_ROOT: '/opt/return-app'
          APP_DIR: '/opt/return-app/Return-App'
          HPANEL_LINK: '/docker/return-app'
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          SSH="ssh -p $HOSTINGER_PORT -i ~/.ssh/id_ed25519 $SSH_OPTS"
          SCP="scp -P $HOSTINGER_PORT -i ~/.ssh/id_ed25519 $SSH_OPTS"

          run_cmd_retry() {
            local max_attempts=4
            local attempt=1
            local delay=4
            while [ $attempt -le $max_attempts ]; do
              echo ">>> Connecting to VPS (attempt $attempt/$max_attempts)..."
              if "$@"; then
                return 0
              fi
              echo "⚠️ Connection attempt $attempt failed. Retrying in ${delay}s..."
              sleep $delay
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
            echo "❌ Connection failed after $max_attempts attempts."
            return 1
          }

          run_cmd_retry $SSH "${HOSTINGER_USER}@${HOSTINGER_HOST}" "mkdir -p ${APP_ROOT} ${APP_DIR} ${APP_DIR}/certs ${APP_DIR}/data"
          run_cmd_retry $SCP /tmp/return-app.env "${HOSTINGER_USER}@${HOSTINGER_HOST}:${APP_ROOT}/uploaded.env"
          if [ -d /tmp/certs ] && [ "$(ls -A /tmp/certs)" ]; then
            $SCP /tmp/certs/* "${HOSTINGER_USER}@${HOSTINGER_HOST}:${APP_DIR}/certs/" || true
          fi
          run_cmd_retry $SCP /tmp/return-app-source.tar.gz "${HOSTINGER_USER}@${HOSTINGER_HOST}:${APP_ROOT}/return-app-source.tar.gz"

          run_cmd_retry $SSH "${HOSTINGER_USER}@${HOSTINGER_HOST}" "bash -s" <<'EOF'
          set -euo pipefail
          APP_ROOT="/opt/return-app"
          APP_DIR="/opt/return-app/Return-App"
          HPANEL_LINK="/docker/return-app"

          echo ">>> [1/7] Extracting source code into $APP_DIR..."
          tar -xzf "${APP_ROOT}/return-app-source.tar.gz" -C "$APP_DIR"
          rm -f "${APP_ROOT}/return-app-source.tar.gz"

          echo ">>> [2/7] Configuring environment and certificates..."
          cd "$APP_DIR"
          if [ -f "${APP_ROOT}/uploaded.env" ]; then
            if [ -f .env ]; then
              while IFS='=' read -r key val || [ -n "$key" ]; do
                [[ "$key" =~ ^#.*$ ]] && continue
                [ -z "$key" ] && continue
                if [ -n "$val" ]; then
                  if grep -q "^${key}=" .env; then
                    sed -i "s|^${key}=.*|${key}=${val}|" .env
                  else
                    printf '%s=%s\n' "$key" "$val" >> .env
                  fi
                fi
              done < "${APP_ROOT}/uploaded.env"
            else
              cp "${APP_ROOT}/uploaded.env" .env
            fi
            rm -f "${APP_ROOT}/uploaded.env"
          fi
          chmod 600 .env

          ln -sf docker-compose.production.yml docker-compose.yml

          echo ">>> [3/7] Registering Hostinger hPanel Docker Manager symlink ($HPANEL_LINK)..."
          mkdir -p "$(dirname "$HPANEL_LINK")"
          ln -sfn "$APP_DIR" "$HPANEL_LINK"

          echo ">>> [4/7] Deploying Docker container via Docker Compose under project 'return-app'..."
          docker compose -p return-app -f docker-compose.production.yml --env-file .env up -d --build --remove-orphans

          echo ">>> Configuring host cron job for nightly 4:30 AM IST payment sync under VPS docker..."
          (crontab -l 2>/dev/null | grep -v 'sync:payment' || true; echo '30 4 * * * docker exec Return-App npm run sync:payment >> /var/log/return-app-payment-sync.log 2>&1') | crontab - || true

          echo ">>> [5/7] Cleaning up dangling Docker build images..."
          docker image prune -f || true

          echo ">>> [6/7] Verifying container status and internal health..."
          docker ps --filter "name=Return-App"
          healthy=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
              echo ">>> Health check PASSED at http://127.0.0.1:3001/api/health"
              healthy=1
              break
            fi
            echo "Waiting for container service to become healthy ($i/20)..."
            sleep 3
          done

          if [ "$healthy" -ne 1 ]; then
            echo "❌ Container failed internal health check. Displaying logs:"
            docker logs Return-App --tail=100 || true
            exit 1
          fi

          echo ">>> [7/7] Verifying Traefik reverse proxy routing..."
          for domain in "return.youthnic.shop" "return.srv1845788.hstgr.cloud"; do
            echo "Testing routing for https://$domain/api/health..."
            curl -k -fsS "https://$domain/api/health" || echo "Note: DNS or cert for $domain might take a moment."
          done

          echo "=========================================================================="
          echo "🎉 Return APP is LIVE on Hostinger VPS!"
          echo "Container: Return-App"
          echo "Hostinger hPanel: $HPANEL_LINK"
          echo "URLs: https://return.youthnic.shop | https://return.srv1845788.hstgr.cloud"
          echo "=========================================================================="
          EOF
