name: Build Return Scan Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/return-scan-apk.yml"
  # A pull request builds, tests and lints the app, and uploads the APK as a workflow artifact for testing.
  # It never publishes a release: the publish step below is skipped for pull requests.
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/return-scan-apk.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server the app talks to"
        required: true
        default: "https://return.youthnic.shop"
      publish:
        description: "Publish GitHub Release artifact"
        type: boolean
        required: false
        default: false

# The build job runs the project's own Gradle code, which a pull request can change, so the workflow is read-only by
# default. Only the publish job below gets write access, and it never runs for a pull request.
permissions:
  contents: read

concurrency:
  group: return-scan-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Native Android Return Scanner APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android Packages
        run: |
          TOOLS="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          [ -d "$TOOLS" ] || TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin | head -1)
          export PATH="$TOOLS:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set Executable Permissions
        run: chmod +x gradlew

      - name: Run Native Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      # Release APKs are signed only from repository secrets: no keystore file or password is in the repo.
      # A missing secret stops the job here, before the release APK is built or signed. Pull requests never get here:
      # they build without any signing secret (see the review build below), so pull-request code never runs next to
      # the release key, and fork pull requests, which receive no secrets, still build.
      - name: Prepare Signing Keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Release APKs are signed only from GitHub secrets (Settings > Secrets and variables > Actions)."
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 did not decode to a keystore file."
            exit 1
          fi
          echo "Release keystore decoded from ANDROID_KEYSTORE_B64 into the runner temp directory."

      - name: Assemble Release APK (R8 & Resource Shrink)
        if: github.event_name != 'pull_request'
        env:
          RS_KEYSTORE: ${{ runner.temp }}/release.keystore
          RS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # Same release variant for pull requests, with no signing secret in the environment. build.gradle signs it with
      # Android's debug key: installable for testing, never a valid update for the warehouse app.
      - name: Assemble Release APK for review (debug-signed, no secrets)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleRelease --no-daemon

      - name: Find Release APK
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"
          echo "Found release APK: $APK"

      - name: Verify Package ID and Version Code
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$RELEASE_APK" > /tmp/badging.txt
          cat /tmp/badging.txt | grep -E "package: name="

          PKG=$(grep -o "name='[^']*'" /tmp/badging.txt | head -1 | cut -d"'" -f2)
          if [ "$PKG" != "shop.youthnic.returnscan" ]; then
            echo "::error::Package ID mismatch! Expected 'shop.youthnic.returnscan', got '$PKG'"
            exit 1
          fi
          echo "Package ID verified: $PKG"

          VCODE=$(grep -o "versionCode='[^']*'" /tmp/badging.txt | head -1 | cut -d"'" -f2)
          echo "versionCode is: $VCODE"
          if [ "$VCODE" -lt 10000 ]; then
            echo "::error::versionCode ($VCODE) must be >= 10000"
            exit 1
          fi
          echo "APP_VCODE=$VCODE" >> "$GITHUB_ENV"

      - name: Verify Camera Permission
        run: |
          grep -q "uses-permission: name='android.permission.CAMERA'" /tmp/badging.txt || {
            echo "::error::android.permission.CAMERA is missing from APK!"
            exit 1
          }
          echo "Camera permission verified in APK."

      # Installed devices accept an update only when it is signed by the same certificate, so pin the signer.
      # Set repository variable ANDROID_SIGNER_SHA256 to turn the pin on; until then the job only warns.
      - name: Verify APK Signing Certificate
        env:
          EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          if ! "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK" > /tmp/apksigner.txt 2>&1; then
            grep -v ' certificate DN: ' /tmp/apksigner.txt || true
            echo "::error::apksigner could not verify the release APK signature."
            exit 1
          fi
          grep -v ' certificate DN: ' /tmp/apksigner.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' /tmp/apksigner.txt | head -1 | tr -d ' :\r' | tr 'A-F' 'a-f')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the signing certificate SHA-256 from the apksigner output."
            exit 1
          fi
          echo "Signing certificate SHA-256: $ACTUAL"
          if [ "$IS_PULL_REQUEST" = "true" ]; then
            echo "::notice::Pull-request build, signed with the debug key for testing only. The release signer pin applies to builds from main and manual runs."
            exit 0
          fi
          EXPECTED=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d ' :\r\n' | tr 'A-F' 'a-f')
          if [ -z "$EXPECTED" ]; then
            echo "::warning::Repository variable ANDROID_SIGNER_SHA256 is not set, so the release signer is not pinned. Once you confirm this is the warehouse release key, set it to $ACTUAL."
          elif [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release APK is signed by certificate $ACTUAL but ANDROID_SIGNER_SHA256 pins $EXPECTED. Installed devices would refuse this update."
            exit 1
          else
            echo "Signing certificate matches ANDROID_SIGNER_SHA256."
          fi

      - name: "Measure APK Byte and MB Size (Budget: <= 5 MB target, <= 10 MB ceiling)"
        run: |
          SIZE_BYTES=$(wc -c < "$RELEASE_APK")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          SHA256=$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)
          echo "=============================================="
          echo "Final Native Android Release APK Size:"
          echo "$SIZE_BYTES bytes ($SIZE_MB MB)"
          echo "SHA-256: $SHA256"
          echo "Target budget: <= 5.0 MB"
          echo "Hard limit:    <= 10.0 MB"
          echo "=============================================="

          # 10 MB hard budget = 10485760 bytes
          if [ "$SIZE_BYTES" -gt 10485760 ]; then
            echo "::error::APK size ($SIZE_MB MB) exceeds hard ceiling of 10 MB!"
            exit 1
          fi
          echo "APK size budget check PASSED."

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: return-scan-app
          path: android/${{ env.RELEASE_APK }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    # A push to main publishes. A manual run publishes only when the "publish" box is ticked (it is off by default).
    # A pull request never publishes.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: return-scan-app
          path: release-input

      - name: Publish Official GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_APK=$(find release-input -name "*.apk" | head -1)
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::No APK found in the downloaded artifact."
            exit 1
          fi
          TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          DIST_DIR="$GITHUB_WORKSPACE/release-dist"
          mkdir -p "$DIST_DIR"
          cp "$RELEASE_APK" "$DIST_DIR/ReturnScan-${TAG_NAME}.apk"
          cp "$RELEASE_APK" "$DIST_DIR/ReturnScan-latest.apk"

          echo "Publishing GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            "$DIST_DIR/ReturnScan-${TAG_NAME}.apk" \
            "$DIST_DIR/ReturnScan-latest.apk" \
            --target "${{ github.sha }}" \
            --title "Return Scan App $TAG_NAME" \
            --notes "Official Android Release APK for Return Scanning App ($TAG_NAME). Built from commit ${{ github.sha }}." || \
          gh release upload "$TAG_NAME" \
            "$DIST_DIR/ReturnScan-${TAG_NAME}.apk" \
            "$DIST_DIR/ReturnScan-latest.apk" \
            --clobber

          # Keep only the newest two ANDROID releases (current + previous, for rollback).
          # Desktop releases (desktop-v*) belong to the desktop workflow and must never be touched here.
          echo "Pruning older Android releases; keeping the newest two..."
          gh release list --limit 100 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v1.0."))] | sort_by(.publishedAt) | reverse | .[2:] | .[].tagName' \
            | while read -r old_tag; do
              if [ -n "$old_tag" ]; then
                echo "Removing old Android release $old_tag..."
                gh release delete "$old_tag" --cleanup-tag -y || true
              fi
            done
