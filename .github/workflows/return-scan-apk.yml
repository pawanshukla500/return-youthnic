name: Build Return Scan Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/return-scan-apk.yml"
  # A pull request builds, tests and lints the app, and uploads the APK as a workflow artifact for testing.
  # It never publishes a release: the publish step below is skipped for pull requests.
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/return-scan-apk.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server the app talks to"
        required: true
        default: "https://return.youthnic.shop"
      publish:
        description: "Publish GitHub Release artifact"
        type: boolean
        required: false
        default: false

# The build job runs the project's own Gradle code, which a pull request can change, so the workflow is read-only by
# default. Only the publish job below gets write access, and it never runs for a pull request.
permissions:
  contents: read

concurrency:
  group: return-scan-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Native Android Return Scanner APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android Packages
        run: |
          TOOLS="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          [ -d "$TOOLS" ] || TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin | head -1)
          export PATH="$TOOLS:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set Executable Permissions
        run: chmod +x gradlew

      - name: Run Native Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Decoding warehouse keystore from ANDROID_KEYSTORE_B64 secret..."
            echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          fi
          if [ ! -f "app/release.keystore" ]; then
            echo "::error::release.keystore is missing! Release APK must be signed with consistent key."
            exit 1
          fi
          echo "Warehouse release keystore ready at app/release.keystore."

      - name: Assemble Release APK (R8 & Resource Shrink)
        env:
          RS_KEYSTORE: app/release.keystore
          RS_KEYSTORE_PASSWORD: youthnicreturnscan
          RS_KEY_ALIAS: returnscan
          RS_KEY_PASSWORD: youthnicreturnscan
        run: ./gradlew assembleRelease --no-daemon

      - name: Find Release APK
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"
          echo "Found release APK: $APK"

      - name: Verify Package ID and Version Code
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$RELEASE_APK" > /tmp/badging.txt
          cat /tmp/badging.txt | grep -E "package: name="

          PKG=$(grep -o "name='[^']*'" /tmp/badging.txt | head -1 | cut -d"'" -f2)
          if [ "$PKG" != "shop.youthnic.returnscan" ]; then
            echo "::error::Package ID mismatch! Expected 'shop.youthnic.returnscan', got '$PKG'"
            exit 1
          fi
          echo "Package ID verified: $PKG"

          VCODE=$(grep -o "versionCode='[^']*'" /tmp/badging.txt | head -1 | cut -d"'" -f2)
          echo "versionCode is: $VCODE"
          if [ "$VCODE" -lt 10000 ]; then
            echo "::error::versionCode ($VCODE) must be >= 10000"
            exit 1
          fi
          echo "APP_VCODE=$VCODE" >> "$GITHUB_ENV"

      - name: Verify Camera Permission
        run: |
          grep -q "uses-permission: name='android.permission.CAMERA'" /tmp/badging.txt || {
            echo "::error::android.permission.CAMERA is missing from APK!"
            exit 1
          }
          echo "Camera permission verified in APK."

      - name: Verify APK Signing Certificate
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"
          echo "APK Signature verification PASSED."

      - name: "Measure APK Byte and MB Size (Budget: <= 5 MB target, <= 10 MB ceiling)"
        run: |
          SIZE_BYTES=$(wc -c < "$RELEASE_APK")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          SHA256=$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)
          echo "=============================================="
          echo "Final Native Android Release APK Size:"
          echo "$SIZE_BYTES bytes ($SIZE_MB MB)"
          echo "SHA-256: $SHA256"
          echo "Target budget: <= 5.0 MB"
          echo "Hard limit:    <= 10.0 MB"
          echo "=============================================="

          # 10 MB hard budget = 10485760 bytes
          if [ "$SIZE_BYTES" -gt 10485760 ]; then
            echo "::error::APK size ($SIZE_MB MB) exceeds hard ceiling of 10 MB!"
            exit 1
          fi
          echo "APK size budget check PASSED."

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: return-scan-app
          path: android/${{ env.RELEASE_APK }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    # A push to main publishes. A manual run publishes only when the "publish" box is ticked (it is off by default).
    # A pull request never publishes.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: return-scan-app
          path: release-input

      - name: Publish Official GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_APK=$(find release-input -name "*.apk" | head -1)
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::No APK found in the downloaded artifact."
            exit 1
          fi
          TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          DIST_DIR="$GITHUB_WORKSPACE/release-dist"
          mkdir -p "$DIST_DIR"
          cp "$RELEASE_APK" "$DIST_DIR/ReturnScan-${TAG_NAME}.apk"
          cp "$RELEASE_APK" "$DIST_DIR/ReturnScan-latest.apk"
          echo "Publishing GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            "$DIST_DIR/ReturnScan-${TAG_NAME}.apk" \
            "$DIST_DIR/ReturnScan-latest.apk" \
            --target "${{ github.sha }}" \
            --title "Return Scan App $TAG_NAME" \
            --notes "Official Android Release APK for Return Scanning App ($TAG_NAME). Built from commit ${{ github.sha }}." || \
          gh release upload "$TAG_NAME" \
            "$DIST_DIR/ReturnScan-${TAG_NAME}.apk" \
            "$DIST_DIR/ReturnScan-latest.apk" \
            --clobber
